[package]
name = "catgraph-applied"
description = "Applied category theory extensions for catgraph: Petri nets, E_n operads, Temperley-Lieb, wiring diagrams, linear combinations, props, operad algebras and functors"
keywords = ["category-theory", "operad", "petri-net", "temperley-lieb", "wiring-diagram"]
categories = ["mathematics", "science", "data-structures"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["parallel"]
# `parallel` enables rayon + rayon_cond::CondIterator at the two sites in
# linear_combination (a HashMap in Mul::mul, a Vec in linear_combine) and the
# two combinations sites in temperley_lieb::non_crossing (those two were
# `par_bridge` before they were unified onto rayon_cond). With the feature off,
# those sites fall back to plain `.into_iter()`. Phase W.1.
parallel = ["dep:rayon", "dep:rayon-cond", "catgraph/parallel"]
# `f64-rig` exposes the mat_f64 module: nalgebra bridge for MatR<F64Rig>
# (determinant, try_inverse, DMatrix roundtrip). Opt-in; off by default to
# keep the nalgebra compile cost out of the way for Tropical / Bool / user
# rigs that can't use field-specific operations anyway.
f64-rig = ["dep:nalgebra"]
# `internal-bench` — Benchmark-only: exposes internal APIs
# (`CongruenceClosure::atom_canonical_for_bench`) for bench fixtures
# only. **NOT public API.** Drives the `presentation::atom_canonical_n*`
# group in `benches/presentation_bench.rs`. Opt-in only (NOT in `default`).
internal-bench = []
# `internal-probes` — Test-only SMC-NF internals. **NOT public API.** Two hooks,
# both for claims in `docs/SMC-NF-RECONCILIATION.md` that were hand-measured and
# therefore could (and did) drift from the code:
#   * `smc_nf::nf_without_column_pass` — the pipeline with Step 6½ skipped, for
#     `smc_canonicality_probes::column_pass_ablation` (§4.5, "What actually
#     depends on the pass").
#   * `smc_nf::fragment_status` — per-diagram marking / closedness, for the
#     `smc_nf_differential_sweep` tracker that classifies divergent pairs as
#     in-𝔉 or marked (§4.6's calibration table), and for
#     `content_equality_corpus`, which scores `prop::presentation::content`
#     against the same corpora and buckets its pins the same way (#57 a1).
# Opt-in only (NOT in `default`).
internal-probes = []
# `serde` adds `Serialize`/`Deserialize` derives on the persistence surface:
#   * terms — `PropExpr`, `ColoredExpr`, `Presentation`, `PresentedProp`,
#     `NormalizeEngine`, `NormalizeResult`, `SfgGenerator`;
#   * rewrite traces (#249) — `RewriteStep`, `RewriteOutcome`;
#   * the content-equality key (#255) — `ContentKey`.
# Off by default: the feature adds no dependency to the default build. That is
# NOT the same as a serde-free default graph — `serde` is already reachable
# transitively via `rust_decimal` (`cargo tree -e normal -i serde`); what this
# gates is *this crate's* own edge and the derives. Terms are the
# machine-persistence representation of morphisms (feeds #72/#73).
# Deserialization is a trusted path throughout, at boundaries documented
# per type: it never re-runs the constructor's checks. `RewriteStep` is the
# exception that proves it — `replay` re-derives every step against the
# running content, which is why that derive needs no validator of its own.
# `RewriteRule` deliberately carries NO derives: its four `new` conditions are
# never re-checked, so a rule is rebuilt from its persisted `(lhs, rhs)` pair.
serde = ["dep:serde"]

[dependencies]
catgraph = { workspace = true }
either.workspace = true
itertools.workspace = true
nalgebra = { workspace = true, optional = true }
# `num` is narrowed to BigInt / Complex / ToPrimitive / pow ONLY — `Zero`/`One`
# are catgraph's own, defined in `src/rig.rs` next to `Rig` (#219). A CI
# grep-guard keeps `num::{Zero,One}` from creeping back. Three files legitimately
# name them: temperley_lieb.rs and linear_combination.rs (the `num::Complex<i32>`
# coefficient substrate) are the guard's two file exclusions, and z.rs imports
# them *aliased* (`One as NumOne`, to drive the inner BigInt), which the guard's
# `(?!\s+as)` lookahead skips without needing an exclusion.
num.workspace = true
permutations.workspace = true
# Base RNG traits only — rationale at the workspace `rand_core` entry (#239).
rand_core.workspace = true
rayon = { workspace = true, optional = true }
rayon-cond = { version = "0.4", optional = true }
rust_decimal.workspace = true
serde = { workspace = true, optional = true }
# Workspace error-derive pattern (already in the tree via catgraph core's
# CatgraphError; adopted for HypergraphError per #28 — no new lockfile entry).
thiserror.workspace = true
# Disjoint sets backing `temperley_lieb`'s composition connectivity — Brauer
# diagram arcs are undirected, so components need a union-find and not a graph
# crate (#220; same substrate `catgraph` uses for its cospan/corel pushouts).
union-find.workspace = true

[dev-dependencies]
# Deterministic LCG for the `smc_nf_differential_sweep` corpus — the sweep's
# counts are pinned, so its randomness must be byte-stable across machines and
# runs (#33's byte-identity contract is exactly that guarantee).
catgraph-testutil.workspace = true
# `rand` is dev-only here (#239 removed the lib edge; `rand_core` replaced it).
# `std`/`std_rng` are re-added on this edge because the workspace entry is
# featureless (#232): the seeded `StdRng` tests, the `operad_boundary`
# integration fixtures, and `mat_ops_bench` all need `StdRng`, and none of it
# reaches downstream lib graphs. `StdRng` satisfies the lib's
# `rand_core::Rng` bound directly — same `rand_core` 0.10 traits.
rand = { workspace = true, features = ["std", "std_rng"] }
criterion.workspace = true
proptest.workspace = true
serde_json.workspace = true

[[bench]]
name = "rayon_thresholds"
harness = false

[[bench]]
name = "mat_ops_bench"
harness = false

[[bench]]
name = "functor_bench"
harness = false

[[bench]]
name = "presentation_bench"
harness = false

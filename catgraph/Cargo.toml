[package]
name = "catgraph"
description = "Category-theoretic graph structures: cospans, spans, Frobenius algebras, and morphisms in symmetric monoidal categories — strict Fong-Spivak 2019"
keywords = ["category-theory", "cospan", "monoidal", "frobenius", "operad"]
categories = ["mathematics", "science", "data-structures"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["parallel"]
# `parallel` enables rayon-based data parallelism at a few hot call sites
# (named_cospan::find_nodes_by_name_predicate, frobenius::hflip). Disable for
# single-threaded `wasm32-wasip1`; keep on for `-threads` and native targets.
parallel = ["dep:rayon"]

[dependencies]
either.workspace = true
itertools.workspace = true
permutations.workspace = true
rayon = { workspace = true, optional = true }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
thiserror.workspace = true
# Disjoint sets for the cospan/corel pushouts. `MorphismSystem`'s dependency-graph
# toposort (acyclicity in `add_definition_composite`, resolution order in
# `fill_black_boxes`) is a local Kahn pass and needs no graph crate at all (#220).
union-find.workspace = true

[dev-dependencies]
# `all_perms` — the exhaustive `Sₙ` enumeration the #258 braiding sweeps run on,
# shared with `catgraph-applied`'s cross-carrier oracle rather than copied (#286,
# #33). Dev-only and unpublished: never a `[dependencies]` entry here.
catgraph-testutil.workspace = true
criterion.workspace = true
proptest.workspace = true
# `std`/`std_rng` re-added on this dev-only edge: the workspace `rand` entry is
# featureless (#232), and the seeded `StdRng::seed_from_u64` fixtures live here.
rand = { workspace = true, features = ["std", "std_rng"] }
env_logger = "0.11"

[[example]]
name = "cospan"

[[example]]
name = "frobenius"

[[bench]]
name = "pushout"
harness = false

[[bench]]
name = "pullback"
harness = false

[package]
name = "catgraph-magnitude"
description = "Magnitude of enriched categories for catgraph: Lawvere metric spaces, Tsallis entropy, Möbius inversion, and BV 2025 closed-form magnitude"
keywords = ["category-theory", "magnitude", "entropy", "enriched-category", "information-theory"]
categories = ["mathematics", "science"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# magnitude no longer needs a `rustworkx` feature: neither `catgraph` nor
# `catgraph-applied` depends on a graph crate at all — their toposort and
# connectivity are local passes (#220) — so there is no flag left to forward.
default = []
# Dev-only cross-validation against `events555/modularsnf` (marker feature;
# gates compilation of tests/snf_modularsnf_integer_oracle.rs).
modularsnf-oracle = []
# `f64-fast` exposes the magnitude_f64 module: ONE symmetric factorization of ζ
# (Cholesky → LBLT, asymmetric/singular → the untouched rig-generic Gauss–Jordan)
# serving weighting / coweighting / magnitude / Möbius, plus cond₁ reporting.
# Opt-in; off by default so the nalgebra compile cost stays out of the way for
# Tropical / Bool / UnitInterval rigs, which cannot use field-specific
# operations anyway (the workspace's "field-bounded paths only" nalgebra rule).
# Default-build results are unchanged — no existing function is touched (#165).
f64-fast = ["dep:nalgebra"]

[dependencies]
catgraph = { workspace = true }
catgraph-applied = { workspace = true }
# Field-bounded paths only (workspace rule) — the `f64-fast` symmetric
# factorization is the sole consumer, and it is off by default (#165).
nalgebra = { workspace = true, optional = true }
# `num` is kept for `BigInt` + `ToPrimitive` only (integer-exact SNF / CRT lift
# and BigInt→i64 rank recovery): the custom integer SNF (Storjohann + Newman)
# and `Z(BigInt)` need arbitrary precision, which nothing else here supplies.
# Rig `Zero`/`One` are catgraph's own, re-exported from `catgraph-applied`'s
# `rig` module (#219) and inherited via the `Rig` bound.
num.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
# Shared deterministic LCG for seeded test/bench/example fixtures (#33).
catgraph-testutil.workspace = true
# Dev-only oracle for tests/snf_modularsnf_integer_oracle.rs (gated by the
# `modularsnf-oracle` feature). Cargo disallows optional dev-deps, so these are
# unconditional; the test source is `#![cfg(feature = "modularsnf-oracle")]`.
modularsnf = { git = "https://github.com/events555/modularsnf", rev = "7eda45d" }
ndarray = "0.16"

[[bench]]
name = "magnitude_bench"
harness = false

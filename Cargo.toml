[workspace]
resolver = "2"
members = [
    "catgraph",
    "catgraph-applied",
    "catgraph-magnitude",
    "catgraph-physics",
    "catgraph-dl",
    "catgraph-syntax",
    "catgraph-testutil",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT"
authors = ["sustia-llc"]
repository = "https://github.com/sustia-llc/catgraph"

[workspace.dependencies]
# --- intra-workspace (path wins locally; version present for a future publish) ---
catgraph           = { path = "catgraph",           version = "0.10.0", default-features = false }
catgraph-applied   = { path = "catgraph-applied",   version = "0.10.0", default-features = false }
catgraph-magnitude = { path = "catgraph-magnitude", version = "0.10.0" }
# Dev-only, unpublished (`publish = false`): only ever a `[dev-dependencies]`
# entry, never a published crate's `[dependencies]`. Shared seeded-fixture LCG (#33).
catgraph-testutil  = { path = "catgraph-testutil" }

# --- DeepCausality thin substrate — PIN EXACT (DC is 0.x, churning).
#     Resolve from crates.io (upstream's own guidance on DC#720). If a git fallback is ever needed,
#     it MUST pin an exact `rev` — NEVER a branch: upstream tagged + published haft 0.4.2 from a
#     branch that was never pushed, so DC `main` still reads 0.4.1 in its own Cargo.toml and a
#     branch-pinned dep silently resolves to PRE-0.4.2 source (deepcausality-rs/deep_causality#720).
#     Fallback (if ever): { git = "https://github.com/deepcausality-rs/deep_causality", rev = "aeff6549e" }
#     — the deep_causality_haft-v0.4.2 tag commit; reachable via the tag even though no branch
#     contains it. (Prior fallback rev, 0.4.1-era: 3280cb844.)
#     haft 0.4.1 (DC v0.15.0 stack, 2026-07-14) shipped the categorical machinery (Category/Kleisli, reified ArrowTerm +
#     interpret_kleisli, symmetric-monoidal PROP, Foldable::fold_map, NaturalTransformation, the Cofree
#     comonad & EqFunctor/DebugFunctor); 0.4.2 adds CloneFunctor + opt-in Clone for Free/Cofree,
#     Cofree::duplicate, and Functor/CoMonad trait impls on CofreeWitness (purely additive). Carrier
#     Clone stays UNADOPTED here — #93 owner decision; adoption tracked as #154.
#     haft is live (catgraph-dl endofunctor layer, #12) and is now the only entry here.
#     `deep_causality_num` was retired in #219 (D1 of the #218 streamlining): the
#     `Zero`/`One` it supplied to applied/magnitude/dl are catgraph's own, in
#     `catgraph-applied/src/rig.rs` next to the native `Rig`.
#     `deep_causality_num_dual` was retired in #221 (D3), in the same change: the
#     forward-mode `Dual` behind catgraph-dl's opt-in `ad` feature is now
#     `catgraph-dl/src/para/dual.rs`. It had to move with the traits — the orphan
#     rule forbids implementing a catgraph-owned `Zero`/`One` for a foreign `Dual`.
#     `ad` now adds no dependency whatsoever (`ad = []`). Note what does NOT change:
#     deep_causality_algebra and deep_causality_num remain in the lock beneath haft
#     either way — catgraph source just never names them.
deep_causality_haft = "=0.4.2"

# --- math / graph — numeric-only, NOT an algebraic substrate ---
# (members opt in with `{ workspace = true, optional = true }`; `optional` is illegal here.)
nalgebra       = "0.35"   # field-bounded paths only
permutations   = "0.1"    # backs braiding — DC Arrow has none
rustworkx-core = "0.18"   # `catgraph-physics` only — coloring + k-core, behind its `rustworkx` feature gate (#10)
# Disjoint sets, the whole graph substrate `catgraph` and `catgraph-applied` need:
# cospan/corel pushouts and Temperley-Lieb composition connectivity. The toposort
# and connected-components sites that used to justify a graph crate are now local
# (#220) — see `catgraph`'s `toposort` and `catgraph-applied`'s `connectivity`.
union-find     = "0.4"

# --- general ---
either       = "1.6.1"
itertools    = "0.15"
num          = "0.4"   # narrowed to BigInt / Complex / ToPrimitive / pow (NOT Zero/One — those are catgraph's own, in catgraph-applied's `rig`)
# `rand` is DEV-ONLY (#239): no member's `[dependencies]` may name it — the
# published randomness edge is `rand_core` below, and CI enforces the dev-only
# invariant (scripts/check_rand_dev_only.py; the wasm lanes cannot catch a
# re-added featureless lib edge, which compiles fine). The two
# [dev-dependencies] edges (catgraph, catgraph-applied) add `std`/`std_rng`
# for their seeded `StdRng` fixtures and benches. Kept featureless here so dev
# edges opt in narrowly and any accidentally re-added lib edge would at least
# ship no default features — `sys_rng`/`thread_rng` pull `getrandom`, whose
# `compile_error!` fails browser-wasm builds (the #232 lesson); a member edge
# can only ADD features, and `default-features = true` on a member WOULD
# re-enable the defaults.
# Dev graphs still reach `getrandom` through proptest: the wasm guarantee is
# `cargo check --lib`, not `--all-targets`.
# CAVEAT: any build graph containing catgraph-physics re-enables rand's
# defaults regardless — its default `rustworkx` feature pulls rustworkx-core,
# which declares rand WITH defaults, and cargo unifies features per crate
# version. Since #239 that is a statement about physics-containing graphs
# only (no lib graph of applied/magnitude/dl/syntax names rand at all); the
# per-package CI wasm lane is #233.
# Not a supported-target policy change — `wasm32-wasip1` remains the wasm lane,
# and browsers stay out of scope (the policy statement lives in
# catgraph/README.md's WASM section).
rand         = { version = "0.10", default-features = false }
# The published randomness edge (#239): catgraph-applied's lib takes a
# caller-supplied generator and samples uniform [0,1) in-tree from raw words,
# so it needs the base traits ONLY — no distributions, no engines, no OS
# entropy. `Rng` + `TryRng` are re-exported as `catgraph_applied::{Rng,
# TryRng}` (the supply contract), which puts rand_core's major version in
# applied's public API — a rand_core 0.11 adoption is a breaking change
# there. rand_core 0.10 declares no features and is `no_std`;
# `default-features = false` is belt-and-braces. NOTE the 0.10 rename: the
# infallible trait is `Rng` (`RngCore` is a deprecated stub) and custom
# engines implement `TryRng<Error = Infallible>`.
rand_core    = { version = "0.10", default-features = false }
rayon        = "1.12"
rust_decimal = "1"
# `serde` is opt-in per member (`{ workspace = true, optional = true }` behind a
# `serde` feature) — off by default so the default build stays serde-free (#81).
# Term persistence: morphisms serialize as `PropExpr<G>` terms (feeds #72/#73).
serde        = { version = "1", features = ["derive"] }
thiserror    = "2"     # workspace error-derive pattern (CatgraphError, HypergraphError — #28)

# --- dev ---
proptest   = "1"
criterion  = { version = "0.8", features = ["html_reports"] }
serde_json = "1"       # serde round-trip tests only (dev-dep, behind the `serde` feature)

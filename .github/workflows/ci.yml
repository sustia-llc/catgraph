name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Identity-substrate guard: `Zero`/`One` resolve through catgraph's own
      # `rig::{Zero, One}` (#219), never the `num` crate's — `num` stays in the
      # dep list for BigInt/Complex, so its identities remain importable by
      # accident. This catches them being brought into scope as usable
      # identities — unaliased braced/single imports (incl. multi-line, via
      # `-U`) AND qualified call sites (`num::Zero::zero()`, `<T as num::Zero>`).
      # `\bnum::` is anchored (it predates the `deep_causality_num` retirement
      # and still correctly avoids matching any `*_num::` path), and the
      # `(?!\s+as)` lookahead skips deliberately *aliased* forms (z.rs's
      # `One as NumOne` for inner BigInt arithmetic), so z.rs needs no exclusion
      # and a future *unaliased* stray there is still caught.
      # Only temperley_lieb.rs + linear_combination.rs legitimately import num's
      # unaliased One/Zero (the num::Complex<i32> coefficient substrate); the
      # real invariant is enforced at compile time by
      # catgraph-applied/tests/rig_identity_substrate.rs — this guard is a
      # supplement.
      - name: grep-guard num::{One,Zero}
        run: |
          matches=$(rg -n -U -P \
            -e '\bnum::\{[^}]*\b(?:One|Zero)\b(?!\s+as)' \
            -e '\buse\s+num::(?:One|Zero)\b' \
            -e '\bnum::(?:One|Zero)::' \
            -e '\bas\s+num::(?:One|Zero)\b' \
            catgraph-applied/src \
            -g '!temperley_lieb.rs' -g '!linear_combination.rs' || true)
          if [ -n "$matches" ]; then
            echo "::error::num's One/Zero used outside the re-substrate exception list:"
            echo "$matches"
            exit 1
          fi
          echo "grep-guard ok: no stray num::{One,Zero}"
      # #111: audit-doc tallies (summary tables, headline %, "(N tests)"
      # citations) are hand-maintained and drifted twice before Phase 1 of the
      # paper audit caught them. This recomputes them from the docs themselves.
      # FS19 + FS18 (drift fixed in audit Phases 1-2) + BV25 (Phase 3 fixed its
      # §2/§3 summary-vs-detail drift; joined the gate here) + BTV21 (ported
      # from the archived coalition audit, #53 item 3; joined the gate here).
      - name: audit-count guard (#111)
        run: python3 scripts/check_audit_counts.py catgraph/docs/FS19-AUDIT.md catgraph-applied/docs/FS18-AUDIT.md catgraph-magnitude/docs/BV25-AUDIT.md catgraph-magnitude/docs/BTV21-AUDIT.md
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # #85: broken intra-doc links (unresolved / private / redundant) shipped
      # because CI had no doc gate. `-D warnings` fails the build on any of them,
      # keeping docs.rs rendering clean now that the crates are public.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - run: cargo test --workspace
      - run: cargo test -p catgraph --no-default-features
      # #43: slim-build exercise for catgraph-physics — proves the crate compiles
      # and tests green with both the `spectral` (nalgebra) and `rustworkx` gates
      # off. Also the first CI coverage of the #10 rustworkx slim build.
      - run: cargo test -p catgraph-physics --no-default-features
      # #81: the opt-in `serde` feature is off by default, so the runs above
      # never exercise its derives or round-trip tests. This targeted run (plus
      # the clippy pass) keeps the serde surface from rotting silently.
      # applied/syntax stay unscoped: their serde-gated tests span several
      # files (serde_roundtrip, colored, rewrite, arity_overflow).
      - run: cargo test -p catgraph-applied -p catgraph-syntax --features serde
      # #230: catgraph-dl joins the clippy lane whole (compile coverage over
      # all targets is cheap) but scopes its test runs to --test
      # serde_roundtrip — dl's only serde-reachable tests — rather than
      # re-running the full dl suite a third and fourth time under feature
      # sets that are derives-only.
      - run: cargo clippy -p catgraph-applied -p catgraph-syntax -p catgraph-dl --features serde --all-targets -- -D warnings
      - run: cargo test -p catgraph-dl --features serde --test serde_roundtrip
      # #230, second half: dl's third serde carrier is `Dual<T>`, and
      # `para::{ad,dual}` compile only under `ad` — so its derives and the
      # `RModule<Dual<f64>>` round-trips are reachable from neither the
      # serde-only lane above nor the `ad`-only lane below. Only the
      # combination covers them. The doc pass exists because the workspace doc
      # gate (#85) runs default features only, so the ad/serde-gated rustdoc
      # (`Dual`'s Serde section and its intra-doc links) is otherwise never
      # link-checked anywhere.
      - run: cargo test -p catgraph-dl --features "serde ad" --test serde_roundtrip
      - run: cargo clippy -p catgraph-dl --features "serde ad" --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p catgraph-dl --features "serde ad" --no-deps
      # #174: `internal-probes` exposes two SMC-NF test hooks, both guarding
      # numbers in `docs/SMC-NF-RECONCILIATION.md` that were hand-measured and so
      # could drift silently — `nf_without_column_pass` for the §4.5 ablation
      # attribution, `fragment_status` for the §4.6 divergence buckets. Off by
      # default, so without its own run both claims go back to being hand-checked.
      # Both 100k sweeps stay `#[ignore]`d; the 5k smoke tracker and the
      # pass-disjointness probes (#174 PR-B) run here.
      # #57 a1: `content_equality_corpus` scores content equality against the
      # same corpora (its own two 100k sweeps are likewise `#[ignore]`d) and
      # reads `fragment_status` for the in-𝔉 bucket, so it is gated the same way.
      # #187 PR1: `canonical_display_corpus` scores the canonical display against
      # those same corpora — the readback proof obligation, display convergence,
      # the Theorem 4.5 agreement tiers and the crossing/churn measurements. Its
      # two 100k sweeps and the cost measurement are `#[ignore]`d; the two 5k
      # smoke tiers run here, and they are the only lane that would catch a
      # readback or convergence regression.
      - run: cargo test -p catgraph-applied --features internal-probes --test smc_nf_completeness --test smc_nf_differential_sweep --test pass_disjointness_probes --test content_equality_corpus --test canonical_display_corpus
      - run: cargo clippy -p catgraph-applied --features internal-probes --all-targets -- -D warnings
      # #34: the dl examples are self-checking (their main() asserts), but the
      # test runs above only *compile* examples — they never execute main(). Run
      # each so a wrong-value regression fails CI, per the issue's acceptance
      # criterion ("each runs green under cargo run --example").
      - run: |
          for ex in para_walkthrough weight_tying free_monad_basics architecture_unrollers; do
            cargo run -q -p catgraph-dl --example "$ex"
          done
      # #74 PR2: the opt-in `ad` feature (forward-mode AD over the crate's own
      # `Dual<T>`, catgraph-owned since #221) is off by default. Since #230 the
      # `serde ad` lane above also compiles `para::{ad,dual}`, so this lane's
      # residual value is the ad-WITHOUT-serde build — catching serde-gated
      # symbols leaking into ad-only code — plus the full-suite run under `ad`
      # and the feature-gated example (the #34 self-checking-example
      # convention; declared `required-features = ["ad"]`, so the loop above
      # skips it).
      - run: cargo test -p catgraph-dl --features ad
      - run: cargo clippy -p catgraph-dl --features ad --all-targets -- -D warnings
      - run: cargo run -q -p catgraph-dl --features ad --example gradient_descent_para
      # #165: the opt-in `f64-fast` feature (ONE symmetric ζ factorization —
      # Cholesky → LBLT → the untouched rig-generic Gauss–Jordan — replacing the
      # three hand-rolled eliminations, plus cond₁ reporting) is off by default,
      # so every run above leaves `magnitude_f64` and `tests/magnitude_f64.rs`
      # uncompiled. Targeted test + clippy pass (the #81 serde-lane shape).
      - run: cargo test -p catgraph-magnitude --features f64-fast
      - run: cargo clippy -p catgraph-magnitude --features f64-fast --all-targets -- -D warnings

  # #11: the slow BV 2025 Prop 3.14 acceptance fixture
  # (euler_char_identity::fixture_3_5point_path_t_2_5) is ignored under
  # debug_assertions ("30s release / 15+ min debug"), so the debug
  # `cargo test --workspace` above never exercises it. This targeted
  # release run covers it. Deliberately NOT `--workspace --release --
  # --ignored`: #14's interchange proptest is now un-ignored and gating, but the
  # cc_completeness_tracking_* diagnostics (incomplete-by-design per #15's
  # functorial-terminal resolution; KB feasibility spike #57) and the #14
  # mid-layer zero-source (η) known-gap follow-up test remain ignored — the
  # depth_3/4 trackers and the η test FAIL by design.
  release-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p catgraph-magnitude --release --test euler_char_identity

  # #233: wasm compile-only regression guard, so the wasm properties probed
  # for #230-#232 can't regress silently. Check-only — running the wasi smoke
  # examples needs the proptest/wait-timeout workaround documented in
  # catgraph/examples/wasi_smoke_core.rs and stays out of scope here.
  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-wasip1-threads, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # NEVER `--workspace` on a wasm target: catgraph-testutil declares
      # proptest as a NORMAL dependency (deliberate, #33), dragging in
      # rusty-fork -> wait-timeout, which has no wasip1 backend. Every lane
      # below scopes to `-p` over the six published crates only.
      #
      # Plain `cargo check -p <crate>` — no `--all-targets`, no `--tests`:
      # the dev graph reaches getrandom 0.3.4 via proptest on wasm and would
      # go red. `cargo check -p` still builds examples where a crate has
      # them; core's and applied's wasi_smoke_* examples compile clean for
      # wasip1 (they were written for it).
      #
      # wasm32-wasip1: the six published crates at default features,
      # including catgraph-physics FULL (rustworkx + spectral + parallel).
      - run: cargo check -p catgraph -p catgraph-applied -p catgraph-magnitude -p catgraph-physics -p catgraph-dl -p catgraph-syntax --target wasm32-wasip1
      # representative opt-ins
      - run: cargo check -p catgraph-magnitude --features f64-fast --target wasm32-wasip1
      - run: cargo check -p catgraph-dl --features ad --target wasm32-wasip1
      - run: cargo check -p catgraph-dl --features "serde ad" --target wasm32-wasip1
      - run: cargo check -p catgraph-applied -p catgraph-syntax --features serde --target wasm32-wasip1
      # slim tier
      - run: cargo check -p catgraph --no-default-features --target wasm32-wasip1
      - run: cargo check -p catgraph-applied --no-default-features --target wasm32-wasip1
      - run: cargo check -p catgraph-physics --no-default-features --target wasm32-wasip1
      # wasm32-wasip1-threads: core at default features.
      - run: cargo check -p catgraph --target wasm32-wasip1-threads
      # wasm32-unknown-unknown, unblocked by #232 (rand slimming): `--lib`
      # only, per applied's CHANGELOG pointer at this issue for the guard.
      - run: cargo check --lib -p catgraph -p catgraph-applied -p catgraph-magnitude -p catgraph-dl -p catgraph-syntax --target wasm32-unknown-unknown
      # catgraph-physics at DEFAULTS stays red on this target by design: its
      # `rustworkx` feature pulls rustworkx-core WITH default features ->
      # getrandom, and cargo feature unification means any graph containing
      # physics-with-rustworkx re-enables getrandom (this is also why
      # --workspace is banned on this whole job). Slim build only.
      - run: cargo check -p catgraph-physics --no-default-features --lib --target wasm32-unknown-unknown

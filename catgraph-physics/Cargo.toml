[package]
name = "catgraph-physics"
description = "Wolfram-physics extensions for catgraph: hypergraph DPO rewriting, multiway evolution, gauge theory, branchial spectral analysis, discrete-time interval algebra"
keywords = ["hypergraph", "multiway", "rewriting", "spectral", "wolfram-physics"]
categories = ["mathematics", "science", "simulation"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["parallel", "rustworkx", "spectral"]
# Pass-through of `catgraph/parallel`. This crate has no direct rayon sites yet,
# but `--no-default-features` consumers expect the transitive catgraph build to
# be single-threaded too.
parallel = ["catgraph/parallel"]
# `rustworkx` gates `multiway::branchial_analysis` — the petgraph + rustworkx-core
# graph algorithms: greedy coloring, k-core, and articulation points on branchial
# graphs, plus betweenness / Katz centrality on multiway evolution graphs (#161).
# Default-on for source-compatibility; opt out via `default-features = false` to
# drop the rustworkx-core → petgraph + ndarray chain for slim / WASM builds.
# Rationale: README.md, "Dependencies".
rustworkx = ["dep:rustworkx-core", "dep:petgraph"]
# `spectral` gates `multiway::branchial_spectrum` — the dense-Laplacian
# eigendecomposition (`SymmetricEigen`: algebraic connectivity λ₂, spectral gap,
# Fiedler vector, spectral clustering). Default-on for source-compatibility; opt
# out via `default-features = false` to drop the nalgebra stack for slim / WASM
# builds (issue #43; companion to the `rustworkx` gate above).
spectral = ["dep:nalgebra"]

[dependencies]
catgraph = { workspace = true }
rustworkx-core = { workspace = true, optional = true }
nalgebra = { workspace = true, optional = true }
petgraph = { version = "0.8", optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
# Shared deterministic LCG for seeded bench fixtures (#33).
catgraph-testutil.workspace = true
# Seeded topology generators (`gnp_random_graph`, `barabasi_albert_graph`,
# `random_regular_graph`, `path_graph`, `petersen_graph`, `grid_graph`) for
# proptest and bench fixtures (#163). This is a *dev* edge on a crate that is
# already an optional lib dep, so the published dep tree is unchanged; it is
# what lets test topologies go past the star / Kₙ shapes the evolution-graph
# builder can produce. Topology only — numeric fixtures stay on the
# `catgraph-testutil` LCG, whose stream is byte-identity-pinned (#33).
rustworkx-core = { workspace = true }

[[bench]]
name = "wasserstein_bench"
harness = false
# The bench compares nalgebra `DMatrix` against the shipped `Vec` implementation,
# so it needs the nalgebra stack (issue #43).
required-features = ["spectral"]

[[bench]]
name = "branchial_bench"
harness = false
# Exercises `multiway::branchial_analysis` (rustworkx) and
# `multiway::branchial_spectrum` (nalgebra), so it needs both gates (#163).
required-features = ["rustworkx", "spectral"]

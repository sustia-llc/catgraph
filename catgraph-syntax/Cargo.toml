[package]
name = "catgraph-syntax"
description = "Textual generator/relation presentation surface for hypergraph-category morphisms, over catgraph-applied's free-prop term engine. Anchored to Fong & Spivak 2018 (Seven Sketches, §5.2) and 2019 (Hypergraph Categories)."
keywords = ["category-theory", "prop", "presentation", "pretty-printer", "dsl"]
categories = ["mathematics", "science"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# `serde` forwards to catgraph-applied's `serde` feature and adds the derive on
# `FrobeniusOr`, so a full syntax term `PropExpr<FrobeniusOr<G>>` round-trips
# (machine complement to the textual parser/printer). Off by default (#81).
serde = ["dep:serde", "catgraph-applied/serde"]

[dependencies]
# `catgraph` supplies `CatgraphError`, the transparent passthrough behind
# `SyntaxError::Catgraph` (arity failures surface from applied's `Free::compose`).
catgraph = { workspace = true }
# `catgraph-applied` is the term engine: `PropExpr<G>`, `Free` smart
# constructors, and the `PropSignature` supertrait `GeneratorSyntax` extends.
catgraph-applied = { workspace = true }
# NO algebra dependency: the value-level Arrow algebra behind the S5 `Traced`
# builder is catgraph's own, defined in `src/arrow_seam.rs` (#222). All ten
# exported names (`Arrow`, `ArrowBuilder`, `Compose`, `Fanout`, `First`, `Id`,
# `Lift`, `Second`, `Split`, `arrow`) are declared there, so this crate's whole
# dependency set is catgraph + catgraph-applied + thiserror (+ optional serde).
serde = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

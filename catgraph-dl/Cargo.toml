[package]
name = "catgraph-dl"
description = "Categorical Deep Learning substrate: Para 2-category, monad/F-(co)algebras, free-monad RNN unrolling, comonoid weight tying. Anchored to Gavranović et al., 'Categorical Deep Learning is an Algebraic Theory of All Architectures' (ICML 2024)."
keywords = ["category-theory", "deep-learning", "para-category", "monad", "f-algebra"]
categories = ["mathematics", "science"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# `ad` adds forward-mode automatic differentiation: `deep_causality_num_dual`'s
# `Dual<T>` becomes a usable scalar `S` for the (#74 PR1) scalar-generic
# `RModule<S>` stack, via `para::ad` (`DualF64Module = RModule<Dual<f64>>`).
# Off by default — the default build stays dual-free (precedent: applied's
# opt-in `serde`, #81). `Dual` satisfies every `RModule<S>` bound with zero
# adaptation, so the feature adds a dependency and a module, not a code path:
# nothing behind `#[cfg(feature = "ad")]` changes default-build behavior.
ad = ["dep:deep_causality_num_dual"]

[dependencies]
catgraph = { workspace = true }
catgraph-applied = { workspace = true }
# DeepCausality substrate.
# `deep_causality_haft` is IN USE (issue #12): the endofunctor abstraction is
# haft's `HKT`/`Functor` witnesses, adopted in `src/endofunctor.rs` (the single
# import seam) and consumed across `algebra::` and `free_monad::`. `Either` (for
# `TreeEndo`) is sourced from haft too, so `catgraph-dl` no longer needs the
# `either` crate.
# `deep_causality_num` is IN USE (issue #36): `src/para/module_actegory.rs`
# imports its root `Zero`/`One` for the `RModule<S>` R-module actegory
# (`F64Module = RModule<f64>`) — the
# ring's additive identity fills the zero vector (`RModule::zeros`) and the
# multiplicative identity marks each standard-basis generator
# (`RModule::basis`). `rg deep_causality_num src` now hits that module. Only
# `Zero`/`One` are used (workspace rule: the DC substrate stays thin). The
# umbrella #36 stays open for the still-deferred non-Set surfaces
# (hyperdoctrine, vector-bundle, lazy final-coalgebra). Rig `Zero`/`One` are
# still inherited transitively from `catgraph-applied`'s `Rig`.
# `deep_causality_num_dual` is OPT-IN (issue #74 PR2), behind the `ad` feature —
# NOT in the default build. It supplies exactly one type, `Dual<T: Real>`
# (forward-mode AD: value + derivative carried together), consumed in
# `src/para/ad.rs`. `Dual` already impls num's own `Zero`/`One` plus
# `Add`/`AddAssign`/`Mul`/`MulAssign` (and the `Mul<T>` scalar form) and derives
# `Copy`/`Clone`/`PartialEq`/`PartialOrd`/`Debug`, which is exactly the bound set
# PR1's per-method `RModule<S>` signatures ask for — so it drops in as a scalar
# with no adapter, no newtype, and no trait of ours.
# Substrate accounting: num_dual deps `deep_causality_algebra "0.2"` (its `Real`
# bound lives at ITS impl site), which the lock already carries at 0.2.0 via haft
# — no duplicate, no new leaf beyond num_dual itself. Rule 2's Zero/One-only
# sourcing is intact: our code never names `deep_causality_algebra`
# (`rg deep_causality_algebra */src` must stay empty) because every catgraph
# use site is the concrete `Dual<f64>`.
deep_causality_num = { workspace = true }
deep_causality_haft = { workspace = true }
deep_causality_num_dual = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

# `ad`-gated: the forward-mode walkthrough (#74 PR2). CI runs its `main()` with
# `--features ad` alongside the four default-feature examples (#34).
[[example]]
name = "gradient_descent_para"
required-features = ["ad"]

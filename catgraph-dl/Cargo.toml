[package]
name = "catgraph-dl"
description = "Categorical Deep Learning substrate: Para 2-category, monad/F-(co)algebras, free-monad RNN unrolling, comonoid weight tying. Anchored to Gavranović et al., 'Categorical Deep Learning is an Algebraic Theory of All Architectures' (ICML 2024)."
keywords = ["category-theory", "deep-learning", "para-category", "monad", "f-algebra"]
categories = ["mathematics", "science"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# `ad` adds forward-mode automatic differentiation: the crate's own `Dual<T>`
# (`src/para/dual.rs`) becomes a usable scalar `S` for the (#74 PR1)
# scalar-generic `RModule<S>` stack, via `para::ad`
# (`DualF64Module = RModule<Dual<f64>>`). Off by default — the default build
# stays dual-free (precedent: applied's opt-in `serde`, #81). Since #221 the
# feature adds **no dependency at all**, only two modules: nothing behind
# `#[cfg(feature = "ad")]` changes default-build behavior.
ad = []
# `serde` adds `Serialize`/`Deserialize` derives on the parameter carriers
# (`RModule<S>`, `DirectSum<A, B>`, and — only when `ad` is also on —
# `Dual<T>`). Off by default, mirroring applied's #81 (#230). Precisely: the
# default build takes no DIRECT serde edge of its own — serde already sits in
# the default graph transitively (catgraph-applied → rust_decimal), so what
# the feature adds is this crate's own edge plus serde_derive. The persistence
# track (#72/#73) already serializes *terms* through applied/syntax;
# `RModule<S>` is the other half — plain `Vec<S>` parameter data. The
# trust-boundary statement of record is `RModule`'s Serde rustdoc section;
# consumers re-check `dim()` at their own entry points.
serde = ["dep:serde"]

[dependencies]
catgraph = { workspace = true }
catgraph-applied = { workspace = true }
# DeepCausality substrate.
# `deep_causality_haft` is IN USE (issue #12): the endofunctor abstraction is
# haft's `HKT`/`Functor` witnesses, adopted in `src/endofunctor.rs` (the single
# import seam) and consumed across `algebra::` and `free_monad::`. `Either` (for
# `TreeEndo`) is sourced from haft too, so `catgraph-dl` no longer needs the
# `either` crate.
# The `Zero`/`One` behind the `RModule<S>` R-module actegory (issue #36;
# `F64Module = RModule<f64>` — the additive identity fills the zero vector in
# `RModule::zeros`, the multiplicative identity marks each standard-basis
# generator in `RModule::basis`) are catgraph's own, from `catgraph-applied`'s
# `rig` module, since #219. The umbrella #36 stays open for the still-deferred
# non-Set surfaces (hyperdoctrine, vector-bundle, lazy final-coalgebra).
# `deep_causality_num_dual` was retired in #221 — `Dual` is now
# `src/para/dual.rs`, which is what lets it implement the catgraph-owned
# `Zero`/`One` at all (the orphan rule forbids a foreign trait on a foreign
# type). `ad` therefore declares no dependency now. `deep_causality_algebra` and
# `deep_causality_num` still sit in the lock beneath haft; our source names
# neither (`rg deep_causality_algebra */src` stays empty).
deep_causality_haft = { workspace = true }
# Opt-in only, behind the `serde` feature (#230; the #81 pattern). The default
# build takes no direct serde edge of its own (transitive serde under
# rust_decimal is pre-existing and feature-independent).
serde = { workspace = true, optional = true }

[dev-dependencies]
# Deterministic LCG for the #156 shape-axis bench fixtures — the payload stream
# must be byte-stable so the recorded allocation counts and latencies are
# reproducible (#33's byte-identity contract). Dev-only / `publish = false`:
# never a `[dependencies]` entry.
catgraph-testutil.workspace = true
criterion.workspace = true
proptest.workspace = true
# Round-trip driver for `tests/serde_roundtrip.rs` (#230), which is itself
# gated on `--features serde`.
serde_json.workspace = true

# #156 Phase 1: the crate's first bench target. Shape-axis baseline for the haft
# `Free`/`Cofree` carriers (construction / `fold` / `unfold` / the #36 lazy
# surfaces), with a counting global allocator. No native-vs-haft comparison —
# Phase 2 did not run.
[[bench]]
name = "free_cofree_shapes"
harness = false

# `ad`-gated: the forward-mode walkthrough (#74 PR2). CI runs its `main()` with
# `--features ad` alongside the four default-feature examples (#34).
[[example]]
name = "gradient_descent_para"
required-features = ["ad"]
